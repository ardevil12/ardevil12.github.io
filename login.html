<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Zenkai</title>
    <script src="/theme-init.js"></script>
    <style>:root{--bg:#f7f8fa;--panel:#fff;--ink:#1f2430;--ink2:#636b7d;--line:#e2e5ea;--accent:#2f6bf0;--on-accent:#fff;--late:#9e3b55;--focus:#2f6bf0}[data-theme=dark]{--bg:#12151f;--panel:#181c29;--ink:#e8ecf3;--ink2:#8d97ab;--line:#232838;--accent:#5c8cff;--on-accent:#0b1020;--late:#ff8fa8}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;place-items:center;min-height:100dvh;padding:24px 16px;font:15px/1.4 General Sans,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid}.card{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;flex-direction:column;align-items:center;gap:10px;width:min(340px,100%);padding:28px 20px 24px;display:flex}.av{width:62px;height:62px}h1{letter-spacing:.14em;font-size:22px;font-weight:700;line-height:1.1}h1 b{color:var(--accent);font-weight:700}.sub{color:var(--ink2);margin-bottom:8px;font-size:14px}.btn{width:100%;min-height:44px;font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;touch-action:manipulation;border-radius:999px;justify-content:center;align-items:center;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:default}.btn.ghost{color:var(--ink);border-color:var(--line);background:0 0}.lnk{color:var(--accent);font:inherit;cursor:pointer;background:0 0;border:0;border-radius:4px;padding:10px;font-size:13px;font-weight:600}.lnk:hover{text-decoration:underline}input{width:100%;min-height:44px;font:inherit;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px}:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}.or{color:var(--ink2);text-transform:uppercase;letter-spacing:.12em;font-size:12px}.lbl{color:var(--ink2);text-align:left;font-size:13px;font-weight:600}.msg{color:var(--late);min-height:18px;font-size:13px;font-weight:600}.msg:empty{display:none}.stack{flex-direction:column;gap:10px;width:100%;display:flex}[hidden]{display:none!important}</style>
    <script type="module" crossorigin src="/pub/login.js"></script>
  </head>
  <body>
    <main class="card" aria-label="Sign in">
      <svg class="av" id="av" viewBox="0 0 62 62" aria-hidden="true"><path d="M14 58c-4-14 0-30 17-30s21 16 17 30z" fill="currentColor"/><path d="M18 31l-3-14 10 8M44 31l3-14-10 8" fill="currentColor"/><circle cx="31" cy="34" r="13" fill="currentColor"/><circle cx="26" cy="33" r="2.4" fill="var(--bg)"/><circle cx="36" cy="33" r="2.4" fill="var(--bg)"/><path d="M47 52c8 0 10-8 6-12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <h1>ZEN<b>KAI</b></h1>
      <p class="sub" id="sub">Private tasks. Sign in to continue.</p>
      <div class="stack" id="login">
        <button class="btn" id="signin" type="button">Sign in with passkey</button>
        <p class="or" aria-hidden="true">or</p>
        <label class="lbl" for="pair">Use a code from your other device</label>
        <input id="pair" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" />
        <button class="btn ghost" id="pair-go" type="button">Sign in with code</button>
        <button class="lnk" id="show-code" type="button">Register a passkey with a code</button>
      </div>
      <div class="stack" id="register" hidden>
        <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Setup or add-device code" />
        <button class="btn" id="go" type="button">Set up this device</button>
        <button class="btn ghost" id="go-pair" type="button">Sign in without a passkey</button>
        <button class="lnk" id="back" type="button">Back</button>
      </div>
      <p class="msg" id="msg" role="alert"></p>
    </main>
  </body>
</html>
